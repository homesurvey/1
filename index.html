<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Second Home Survey TERN</title>
  <style>
    :root {
      --font-text: 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-display: 'SF Pro Display', 'SF Pro Text', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --gold: #C4A265;
      --gold-light: #D9C48E;
      --gold-dark: #A8894F;
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #1d1d1f;
      --text-muted: #6e6e73;
      --text-soft: #86868b;
      --border: #e8e8ed;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-synthesis: none; }

    html {
      font-family: var(--font-text);
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--surface);
      box-shadow: 0 0 80px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
    }

    .brand-bar {
      flex-shrink: 0;
      padding: 22px 20px 4px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .brand-logo {
      height: 92px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .progress-wrap {
      flex-shrink: 0;
      padding: 16px 20px 0;
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
      pointer-events: none;
    }

    .progress-wrap.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 500;
      color: #c7c7cc;
    }

    .progress-meta span:last-child { color: #d4bc8a; }

    .progress-track {
      height: 3px;
      background: #f0f0f5;
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e8d9b8, #e5d4ad, #f0e6c8);
      border-radius: 100px;
      transition: width 0.4s var(--ease);
    }

    .viewport { position: relative; flex: 1; overflow: hidden; }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 24px 28px 32px;
      visibility: hidden;
      transform: translateX(100%);
      transition: transform 0.32s var(--ease);
      pointer-events: none;
    }

    .screen.active {
      visibility: visible;
      transform: translateX(0);
      pointer-events: auto;
      z-index: 2;
    }

    .screen.prepare-left {
      transform: translateX(-100%);
      transition: none;
    }

    .screen.exit-left {
      visibility: visible;
      transform: translateX(-100%);
      pointer-events: none;
      z-index: 1;
    }

    .screen.exit-right {
      visibility: visible;
      transform: translateX(100%);
      pointer-events: none;
      z-index: 1;
    }

    .screen-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      width: 100%;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding: 8px 0 12px;
    }

    .screen-body::-webkit-scrollbar { display: none; }

    .screen-footer {
      flex-shrink: 0;
      padding-top: 12px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .screen h1 {
      font-family: var(--font-display);
      font-size: clamp(28px, 7vw, 34px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .lead {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 340px;
    }

    .question-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background:
        radial-gradient(circle at 30% 25%, rgba(255, 248, 235, 0.95), transparent 55%),
        linear-gradient(155deg, rgba(196, 162, 101, 0.22), rgba(196, 162, 101, 0.06) 55%, rgba(255, 255, 255, 0.5));
      border: 1px solid rgba(196, 162, 101, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-dark);
      flex-shrink: 0;
    }

    .question-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .question-title {
      font-family: var(--font-display);
      font-size: clamp(22px, 5.5vw, 26px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.25;
      max-width: 360px;
      margin-bottom: 10px;
    }

    .question-sub {
      font-size: 13px;
      color: var(--text-soft);
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .choice-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 360px;
    }

    .choice-list.is-badges {
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 380px;
    }

    .choice-list.is-images {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 380px;
    }

    .choice-chip {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-text);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      padding: 14px 16px;
      border-radius: 14px;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease), color 0.2s var(--ease), box-shadow 0.2s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }

    .choice-list.is-badges .choice-chip {
      width: auto;
      text-align: center;
      padding: 10px 14px;
      border-radius: 100px;
      font-size: 13px;
    }

    .choice-list.is-images .choice-chip.is-image {
      padding: 0;
      margin: 0;
      overflow: visible;
      aspect-ratio: auto;
      background: transparent;
      border: 0;
      outline: none;
      box-shadow: none;
      border-radius: 0;
      line-height: 1.3;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .choice-list.is-images .choice-chip.is-image .choice-media {
      width: 100%;
      aspect-ratio: 1 / 1.05;
      overflow: hidden;
      border-radius: 18px;
      line-height: 0;
    }

    .choice-list.is-images .choice-chip.is-image .choice-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      border: 0;
      border-radius: 0;
    }

    .choice-list.is-images .choice-chip.is-image .choice-label {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      color: var(--text);
    }

    .choice-list.is-images .choice-chip.is-image.is-on .choice-label {
      color: var(--gold-dark);
    }

    .choice-list.is-images .choice-chip.is-image-other {
      grid-column: 1 / -1;
      text-align: center;
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.35;
    }

    .choice-chip.is-on {
      background: rgba(196, 162, 101, 0.14);
      border-color: rgba(196, 162, 101, 0.55);
      color: var(--gold-dark);
    }

    .choice-list.is-images .choice-chip.is-image.is-on {
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .choice-list.is-images .choice-chip.is-image.is-on .choice-media {
      box-shadow: 0 0 0 2.5px rgba(196, 162, 101, 0.85);
    }

    .other-wrap {
      width: 100%;
      max-width: 360px;
      margin-top: 12px;
    }

    .choice-list.is-badges + .other-wrap {
      max-width: 380px;
    }

    .other-wrap[hidden] {
      display: none;
    }


    .country-wrap {
      width: 100%;
      max-width: 380px;
      margin-top: 12px;
      text-align: left;
    }

    .country-wrap[hidden] { display: none; }

    .country-search {
      appearance: none;
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-text);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      padding: 12px 14px;
      border-radius: 14px;
      outline: none;
      margin-bottom: 8px;
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }

    .country-search:focus {
      border-color: rgba(196, 162, 101, 0.55);
      box-shadow: 0 0 0 3px rgba(196, 162, 101, 0.16);
    }

    .country-search::placeholder {
      color: var(--text-soft);
      font-weight: 400;
    }

    .country-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .country-item {
      appearance: none;
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-family: var(--font-text);
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      padding: 12px 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .country-item:last-child { border-bottom: none; }

    .country-item.is-on {
      background: rgba(196, 162, 101, 0.14);
      color: var(--gold-dark);
    }

    .country-empty {
      padding: 16px 14px;
      font-size: 13px;
      color: var(--text-soft);
      text-align: center;
    }

    .text-wrap {
      width: 100%;
      max-width: 360px;
    }

    .text-input {
      appearance: none;
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-text);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      padding: 14px 16px;
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }

    .text-input:focus {
      border-color: rgba(196, 162, 101, 0.55);
      box-shadow: 0 0 0 3px rgba(196, 162, 101, 0.16);
    }

    .text-input::placeholder {
      color: var(--text-soft);
      font-weight: 400;
    }

    .other-input {
      appearance: none;
      width: 100%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-text);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      padding: 14px 16px;
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }

    .other-input:focus {
      border-color: rgba(196, 162, 101, 0.55);
      box-shadow: 0 0 0 3px rgba(196, 162, 101, 0.16);
    }

    .other-input::placeholder {
      color: var(--text-soft);
      font-weight: 400;
    }

    .btn {
      appearance: none;
      border: none;
      width: 100%;
      padding: 16px 24px;
      border-radius: 14px;
      font-family: var(--font-text);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
      color: #fff;
      box-shadow: 0 8px 24px rgba(196, 162, 101, 0.35);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      padding: 12px;
    }

    .thank-circle {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(196, 162, 101, 0.12);
      border: 1px solid rgba(196, 162, 101, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .thank-circle svg { width: 48px; height: 48px; }
    .thank-circle path {
      fill: none;
      stroke: var(--gold);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (min-width: 520px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .app {
        min-height: min(780px, 92dvh);
        border-radius: 24px;
        overflow: hidden;
      }
    }
  </style>
</head>

      listEl.innerHTML = items.map(c => {
        const on = selected === c ? ' is-on' : '';
        const safe = c.replace(/"/g, '&quot;');
        return `<button type="button" class="country-item${on}" data-country="${safe}">${c}</button>`;
      }).join('');
    }

    function icon(paths) {
      return `<div class="question-icon" aria-hidden="true"><svg viewBox="0 0 24 24">${paths}</svg></div>`;
    }

    function buildWelcome() {
      const el = document.createElement('section');
      el.className = 'screen';
      el.innerHTML = `
        <div class="screen-body">
          ${icon('<path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/>')}
          <h1>Second Home Survey TERN</h1>
          <p class="lead">A few short questions about your preferences for an affordable second home in the Red Sea Destinations.</p>
        </div>
        <div class="screen-footer">
          <button type="button" class="btn btn-primary" data-action="next">Let's Go</button>
        </div>`;
      return el;
    }

    function buildQuestion(index) {
      const q = QUESTIONS[index];
      const el = document.createElement('section');
      el.className = 'screen';
      el.dataset.q = String(index);

      if (q.type === 'text') {
        el.innerHTML = `
        <div class="screen-body">
          ${icon(q.icon)}
          <h2 class="question-title">${q.title}</h2>
          <p class="question-sub" style="min-height:0;margin:0 0 16px"></p>
          <div class="text-wrap">
            <input type="text" class="text-input" placeholder="${q.placeholder || 'Type here'}" maxlength="80" autocomplete="name" aria-label="${q.title}">
          </div>
        </div>
        <div class="screen-footer">
          <button type="button" class="btn btn-primary" data-action="next" disabled>Continue</button>
          <button type="button" class="btn btn-ghost" data-action="back">Back</button>
        </div>`;
        return el;
      }

      const isImages = q.layout === 'images';
      const useBadges = !isImages && q.options.length >= 6;
      const listClass = isImages ? ' is-images' : (useBadges ? ' is-badges' : '');
      const chips = q.options.map(opt => {
        const value = optionValue(opt);
        const label = optionLabel(opt);
        const safe = value.replace(/"/g, '&quot;');
        if (isImages && opt.image) {
          return `<button type="button" class="choice-chip is-image" data-value="${safe}" aria-pressed="false" aria-label="${label}">
            <span class="choice-media"><img src="${opt.image}" alt="${label}" loading="lazy"></span>
            <span class="choice-label">${label}</span>
          </button>`;
        }
        const otherClass = isImages && value === 'Other' ? ' is-image-other' : '';
        return `<button type="button" class="choice-chip${otherClass}" data-value="${safe}" aria-pressed="false">${label}</button>`;
      }).join('');
      let otherField = '';
      if (hasOther(q)) {
        if (q.otherMode === 'countries') {
          otherField = `<div class="country-wrap" hidden>
            <input type="search" class="country-search" placeholder="Search countries" autocomplete="off" aria-label="Search countries">
            <div class="country-list" role="listbox" aria-label="Countries"></div>
          </div>`;
        } else {
          otherField = `<div class="other-wrap" hidden>
            <input type="text" class="other-input" placeholder="Please specify" maxlength="120" autocomplete="off" aria-label="Please specify other">
          </div>`;
        }
      }
      const continueHidden = q.type === 'single' ? ' hidden' : '';
      el.innerHTML = `
        <div class="screen-body">
          ${icon(q.icon)}
          <h2 class="question-title">${q.title}</h2>
          ${q.sub ? `<p class="question-sub">${q.sub}</p>` : '<p class="question-sub" style="min-height:0;margin:0 0 16px"></p>'}
          <div class="choice-list${listClass}" role="group" aria-label="${q.title}">${chips}</div>
          ${otherField}
        </div>
        <div class="screen-footer">
          <button type="button" class="btn btn-primary" data-action="next"${continueHidden} disabled>Continue</button>
          <button type="button" class="btn btn-ghost" data-action="back">Back</button>
        </div>`;
      return el;
    }

    function buildThankYou() {
      const el = document.createElement('section');
      el.className = 'screen';
      el.innerHTML = `
        <div class="screen-body">
          <div class="thank-circle">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <h1>Thank you</h1>
          <p class="lead">Thank you — your input has been received.</p>
        </div>`;
      return el;
    }

    const screens = [buildWelcome(), ...QUESTIONS.map((_, i) => buildQuestion(i)), buildThankYou()];
    screens.forEach(s => viewport.appendChild(s));

    const thankStep = screens.length - 1;
    const firstQ = 1;
    const lastQ = QUESTIONS.length;

    function isQuestionVisible(qIndex) {
      const q = QUESTIONS[qIndex];
      if (typeof q.skipIf === 'function') return !q.skipIf(answers);
      return true;
    }

    function visibleQuestionIndexes() {
      return QUESTIONS.map((_, i) => i).filter(isQuestionVisible);
    }

    function nextQuestionStep(qIndex) {
      for (let i = qIndex + 1; i < QUESTIONS.length; i++) {
        if (isQuestionVisible(i)) return i + 1;
      }
      return thankStep;
    }

    function prevQuestionStep(qIndex) {
      for (let i = qIndex - 1; i >= 0; i--) {
        if (isQuestionVisible(i)) return i + 1;
      }
      return 0;
    }

    function clearSkippedAnswers() {
      QUESTIONS.forEach((q, i) => {
        if (!isQuestionVisible(i)) answers[i] = q.type === 'multi' ? [] : '';
      });
    }

    function syncQuestionUI(qIndex) {
      const screen = screens[qIndex + 1];
      const q = QUESTIONS[qIndex];
      const continueBtn = screen.querySelector('[data-action="next"]');
      const answer = answers[qIndex];

      if (q.type === 'text') {
        const textInput = screen.querySelector('.text-input');
        if (textInput && textInput.value !== answer) textInput.value = answer || '';
        continueBtn.hidden = false;
        continueBtn.disabled = !(answer || '').trim();
        return;
      }

      const chips = screen.querySelectorAll('.choice-chip');
      const otherWrap = screen.querySelector('.other-wrap');
      const otherInput = screen.querySelector('.other-input');
      const countryWrap = screen.querySelector('.country-wrap');
      const countrySearch = screen.querySelector('.country-search');
      const countryList = screen.querySelector('.country-list');
      const showOther = otherSelected(q, answer);
      const mains = mainOptions(q);

      chips.forEach(chip => {
        let on;
        if (q.type === 'multi') {
          on = answer.includes(chip.dataset.value);
        } else if (chip.dataset.value === 'Other' && q.otherMode === 'countries') {
          on = answer === 'Other' || isCountryPick(q, answer);
        } else {
          on = answer === chip.dataset.value;
        }
        chip.classList.toggle('is-on', on);
        chip.setAttribute('aria-pressed', on ? 'true' : 'false');
      });

      if (otherWrap) {
        const wasHidden = otherWrap.hidden;
        otherWrap.hidden = !showOther;
        if (otherInput) {
          if (showOther) {
            otherInput.value = otherTexts[qIndex];
            if (wasHidden) requestAnimationFrame(() => otherInput.focus());
          } else {
            otherTexts[qIndex] = '';
            otherInput.value = '';
          }
        }
      }

      if (countryWrap) {
        const wasHidden = countryWrap.hidden;
        countryWrap.hidden = !showOther;
        if (showOther) {
          const selected = isCountryPick(q, answer) ? answer : '';
          const query = countrySearch ? countrySearch.value : '';
          renderCountryList(countryList, selected, query);
          if (wasHidden && countrySearch) requestAnimationFrame(() => countrySearch.focus());
        } else if (countrySearch) {
          countrySearch.value = '';
        }
      }

      if (q.type === 'multi') {
        continueBtn.hidden = false;
        continueBtn.disabled = answer.length === 0 || !otherComplete(qIndex);
      } else if (showOther) {
        continueBtn.hidden = false;
        continueBtn.disabled = !otherComplete(qIndex);
      } else {
        continueBtn.hidden = true;
      }
    }

    QUESTIONS.forEach((_, qIndex) => syncQuestionUI(qIndex));

    function updateProgress() {
      const inQuestions = step >= firstQ && step <= lastQ;
      progressWrap.classList.toggle('visible', inQuestions);
      progressWrap.setAttribute('aria-hidden', inQuestions ? 'false' : 'true');
      if (!inQuestions) return;
      const visible = visibleQuestionIndexes();
      const qIndex = step - 1;
      const pos = Math.max(1, visible.indexOf(qIndex) + 1);
      const total = visible.length;
      const pct = Math.round((pos / total) * 100);
      stepLabel.textContent = 'Question ' + pos + ' of ' + total;
      stepPct.textContent = pct + '%';
      progressFill.style.width = pct + '%';
    }

    function showStep(next, dir) {
      if (busy || next === step) return;
      busy = true;
      const current = screens[step];
      const upcoming = screens[next];
      upcoming.classList.remove('exit-left', 'exit-right', 'prepare-left', 'active');
      if (dir < 0) upcoming.classList.add('prepare-left');
      void upcoming.offsetWidth;
      current.classList.remove('active');
      current.classList.add(dir > 0 ? 'exit-left' : 'exit-right');
      upcoming.classList.add('active');
      upcoming.classList.remove('prepare-left');
      step = next;
      updateProgress();
      setTimeout(() => {
        current.classList.remove('exit-left', 'exit-right', 'active');
        busy = false;
      }, SLIDE_MS);
    }


    function resolveAnswer(qIndex) {
      const q = QUESTIONS[qIndex];
      const answer = answers[qIndex];
      const other = (otherTexts[qIndex] || '').trim();
      if (q.type === 'multi') {
        return (answer || []).map(v => (v === 'Other' && other) ? ('Other: ' + other) : v);
      }
      if (q.otherMode === 'countries') return answer || '';
      if (answer === 'Other' && other) return 'Other: ' + other;
      return answer || '';
    }

    function buildPayload() {
      const payload = { raw_answers: {} };
      QUESTIONS.forEach((q, i) => {
        const value = isQuestionVisible(i) ? resolveAnswer(i) : null;
        if (q.key) payload[q.key] = value;
        payload.raw_answers[q.key || q.title] = value;
      });
      return payload;
    }

    async function submitResponses() {
      if (submitted) return;
      submitted = true;
      const payload = buildPayload();

      if (!supabaseClient) {
        console.warn('Supabase is not configured. Set SUPABASE_URL and SUPABASE_ANON_KEY.');
        console.log('Survey payload:', payload);
        return;
      }

      try {
        const { error } = await supabaseClient
          .from('second_home_responses')
          .insert([payload]);
        if (error) {
          submitted = false;
          console.error('Supabase insert failed:', error);
        }
      } catch (err) {
        submitted = false;
        console.error('Supabase submit error:', err);
      }
    }

    function goNext() {
      if (step === 0) return showStep(1, 1);
      if (step >= firstQ && step <= lastQ) {
        const qIndex = step - 1;
        const q = QUESTIONS[qIndex];
        const answer = answers[qIndex];
        if (q.type === 'multi' && answer.length === 0) return;
        if (q.type === 'single' && !answer) return;
        if (q.type === 'text' && !(answer || '').trim()) return;
        if (!otherComplete(qIndex)) return;
        clearSkippedAnswers();
        const next = nextQuestionStep(qIndex);
        if (next === thankStep) submitResponses();
        return showStep(next, 1);
      }
    }

    function goBack() {
      if (step === firstQ) return showStep(0, -1);
      if (step > firstQ && step <= lastQ) {
        const qIndex = step - 1;
        return showStep(prevQuestionStep(qIndex), -1);
      }
    }

    viewport.addEventListener('click', e => {
      const countryItem = e.target.closest('.country-item');
      if (countryItem && step >= firstQ && step <= lastQ) {
        const qIndex = step - 1;
        answers[qIndex] = countryItem.dataset.country;
        syncQuestionUI(qIndex);
        setTimeout(() => goNext(), 180);
        return;
      }

      const chip = e.target.closest('.choice-chip');
      if (chip && step >= firstQ && step <= lastQ) {
        const qIndex = step - 1;
        const q = QUESTIONS[qIndex];
        const value = chip.dataset.value;

        if (q.type === 'single') {
          answers[qIndex] = value;
          syncQuestionUI(qIndex);
          if (value !== 'Other') setTimeout(() => goNext(), 180);
          return;
        }

        const selected = new Set(answers[qIndex]);
        if (selected.has(value)) selected.delete(value);
        else if (selected.size < (q.max || 3)) selected.add(value);
        answers[qIndex] = Array.from(selected);
        syncQuestionUI(qIndex);
        return;
      }

      const action = e.target.closest('[data-action]')?.dataset.action;
      if (action === 'next') goNext();
      if (action === 'back') goBack();
    });

    viewport.addEventListener('input', e => {
      if (step < firstQ || step > lastQ) return;
      const qIndex = step - 1;
      const q = QUESTIONS[qIndex];
      const screen = screens[qIndex + 1];
      const continueBtn = screen.querySelector('[data-action="next"]');

      const textInput = e.target.closest('.text-input');
      if (textInput) {
        answers[qIndex] = textInput.value;
        continueBtn.disabled = !textInput.value.trim();
        return;
      }

      const countrySearch = e.target.closest('.country-search');
      if (countrySearch) {
        const list = screen.querySelector('.country-list');
        const selected = isCountryPick(q, answers[qIndex]) ? answers[qIndex] : '';
        renderCountryList(list, selected, countrySearch.value);
        return;
      }

      const input = e.target.closest('.other-input');
      if (!input) return;
      otherTexts[qIndex] = input.value;
      if (q.type === 'multi') {
        continueBtn.disabled = answers[qIndex].length === 0 || !otherComplete(qIndex);
      } else {
        continueBtn.disabled = !otherComplete(qIndex);
      }
    });

    screens[0].classList.add('active');
    updateProgress();
  })();
  </script>
</body>
</html>
